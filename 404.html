<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Linkmedia</title>
<meta name="robots" content="noindex, follow">
<script>
// Mapa de redirecionamentos: URL antiga → âncora nova
const redirects = {
  '/contato':              '/#contato',
  '/solucoes':             '/#solucoes',
  '/sobre':                '/#numeros',
  '/demonstracao':         '/#contato',
  '/politica-privacidade': '/politica-privacidade.html',
  '/politica-anticorrupcao': '/politica-anticorrupcao.html'
};
const path = window.location.pathname.replace(/\/$/, '');
const dest = redirects[path];
if (dest) {
  window.location.replace(dest);
} else {
  // fallback genérico
  setTimeout(() => window.location.replace('/'), 3000);
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#040810; --card:#0c1428; --border:#1a2540; --cyan:#00d2d3; --blue:#1e56d9; --text:#e8edf8; --muted:#7a8aaa; --grad:linear-gradient(135deg,#00d2d3,#1e56d9); }
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;}
.wrap{max-width:480px;}
.code{font-size:80px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
h1{font-size:24px;font-weight:800;margin:16px 0 10px;}
p{color:var(--muted);font-size:15px;margin-bottom:28px;}
a{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;font-size:14px;font-weight:700;padding:12px 24px;border-radius:8px;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p>Estamos te redirecionando automaticamente. Se não funcionar, clique abaixo.</p>
  <a href="/">Voltar para o site →</a>
</div>
</body>
</html>
